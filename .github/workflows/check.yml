name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run check
      - uses: actions/upload-artifact@v4
        with:
          name: n1rwj-cwt
          path: |
            dist/*.h2kext
            dist/*.h2kext.sha256
          if-no-files-found: error
